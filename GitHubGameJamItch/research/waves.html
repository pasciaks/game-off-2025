<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Rotating Gravitational Waves</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #05060a;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hidden {
      display: none;
      opacity: 0;
    }

    /* Optional: define default state when visible */
    .fade-in {
      display: block;
      animation: fadeIn 1s ease forwards;
    }

    .fade-out {
      display: block;
      animation: fadeOut 1s ease forwards;
    }

    /* The actual animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    /* The actual animation */
    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }


    #game {
      text-align: center;
      position: absolute;
      left: 20px;
      right: 20px;
      top: 20px;
      bottom: 20px;
      border: 2px solid red;
      color: white;
      display: none;
      background-color: rgba(25, 98, 115, .85);
      overflow: hidden;
    }
  </style>
</head>

<body>

  <div id="game">
    <p>\/\/ a v e s !</p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    (() => {

      function showBox() {
        document.getElementById("game").style.display = "block";
        const el = document.getElementById('game');
        el.classList.remove('hidden');
        el.classList.remove('fade-out');
        el.classList.add('fade-in');
      }

      function hideBox() {
        document.getElementById("game").style.display = "block";
        const el = document.getElementById('game');
        el.classList.remove('hidden');
        el.classList.remove('fade-in');
        el.classList.add('fade-out');
      }

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let width, height, center, maxRadius;

      // Tuned parameters for cleaner, slower pulses
      const SPEED = 150;           // expansion speed (px/sec)
      const WAVELENGTH = 5;     // distance between waves (larger = fewer)
      const GLOW = 0;            // shadow blur for glow
      const SPAWN_INTERVAL = 220; // time between new waves (ms)
      const ROTATION_SPEED = 0.025; // radians/sec rotation of opening

      let waves = [];

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        width = innerWidth;
        height = innerHeight;
        center = { x: width / 2, y: height / 2 };
        maxRadius = Math.hypot(width, height) * 0.6;
      }
      window.addEventListener('resize', resize);
      resize();

      function createWave() {
        const gapAngle = Math.random() * Math.PI * 2;
        const gapSize = 0;//Math.PI * (0.3 + Math.random() * 0.4);
        const hue = 190 + Math.random() * 40; // blue/cyan variation
        waves.push({
          startTime: performance.now(),
          gapAngle,
          gapSize,
          hue,
          offX: Math.random(),
          offY: Math.random()
        });
      }

      createWave();

      document.addEventListener("keydown", (e) => {

        if (e.key == ' ') {
          isPaused = !isPaused;
        }

        if (e.key == 'i') {
          showBox();
        }

        if (e.key == 'o') {
          hideBox();
        }

      })

      let old;

      let isPaused = false;

      setInterval(createWave, SPAWN_INTERVAL);

      function animate(now) {

        if (isPaused) {
          now = old;
        }

        old = now;

        ctx.fillStyle = 'rgba(5,6,10,0.3)'; // faint fade trail
        ctx.fillRect(0, 0, width, height);

        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = 'rgba(130,210,255,0.8)';
        ctx.shadowBlur = GLOW;

        for (const wave of waves) {
          const elapsed = (now - wave.startTime) / 1000;
          const radius = elapsed * SPEED;

          if (radius > maxRadius) continue;
          if (radius < 0) continue;

          const alpha = 1 - radius / maxRadius;
          ctx.lineWidth = 2 + 1.5 * alpha;
          ctx.strokeStyle = `hsla(${wave.hue}, 80%, 70%, ${alpha * 0.9})`;

          // slowly rotate the opening over time
          const rotatedGapAngle = wave.gapAngle + elapsed * ROTATION_SPEED;

          const start = rotatedGapAngle + wave.gapSize / 2;
          const end = rotatedGapAngle - wave.gapSize / 2 + Math.PI * 2;

          ctx.beginPath();
          ctx.arc(center.x + (.5 - wave.offX) * 350, center.y + (.5 - wave.offY) * 350, radius, start, end);
          ctx.stroke();
        }

        // cleanup old waves
        waves = waves.filter(w => (now - w.startTime) / 1000 * SPEED < maxRadius);

        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>

</html>
