<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="./game/player.png">
  <title>Scrabble Scramble</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #05060a;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hidden {
      display: none;
      opacity: 0;
    }

    /* Optional: define default state when visible */
    .fade-in {
      display: block;
      animation: fadeIn 1s ease forwards;
    }

    .fade-out {
      display: block;
      animation: fadeOut 1s ease forwards;
    }

    /* The actual animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    /* The actual animation */
    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }


    #game {
      text-align: center;
      position: absolute;
      left: 20px;
      right: 20px;
      top: 20px;
      bottom: 20px;
      border: 2px solid red;
      color: white;
      display: none;
      background-color: rgba(25, 98, 115, .85);
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #0ee1ec;
      /* Tan background */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1,
    h2,
    p {
      text-align: center;
      margin: 10px 0;
      color: #cfcfcf;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #89aebc;
      color: rgb(95, 76, 204);
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #31a9a7;
      transform: scale(1.05);
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
      /* center the container itself */
      justify-items: center;
      /* center each item horizontally */
      align-items: center;
      /* center items vertically in their grid cells */
      text-align: center;
    }


    /* .game-container {
      text-align: center;
      align-items: center;
      justify-content: space-between;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 1000px;
      margin-bottom: 40px;
    } */

    .game-container a {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: #f0e6d2;
      /* light card color */
      color: #4879b4;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-container a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.25);
      background: #74d8ff;
    }

    img {
      width: 50%;
    }
  </style>
</head>

<body>

  <div id="game">

    <a href="index.html"><img src='game/logo.png' /></a>

    <a href="index.html">
      <div id="randomTitle"></div>
    </a>

    <h2><span id="playerName"></span></h2>

    <p><button style="font:26px 'Segoe UI Emoji', sans-serif;background-color:transparent;"
        onclick="updateRandomName();">🎲</button></p>

    <div class="game-container" id="gameLinks"></div>

  </div>

  <canvas id="canvas"></canvas>

  <script>

    function showBox() {
      document.getElementById("game").style.display = "block";
      const el = document.getElementById('game');
      el.classList.remove('hidden');
      el.classList.remove('fade-out');
      el.classList.add('fade-in');
    }

    function hideBox() {
      document.getElementById("game").style.display = "block";
      const el = document.getElementById('game');
      el.classList.remove('hidden');
      el.classList.remove('fade-in');
      el.classList.add('fade-out');
    }

    const canvas = document.getElementById('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    let width, height, center, maxRadius;

    // Tuned parameters for cleaner, slower pulses
    const SPEED = 150;           // expansion speed (px/sec)
    const WAVELENGTH = 5;     // distance between waves (larger = fewer)
    const GLOW = 0;            // shadow blur for glow
    const SPAWN_INTERVAL = 220; // time between new waves (ms)
    const ROTATION_SPEED = 0.025; // radians/sec rotation of opening

    let waves = [];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      width = innerWidth;
      height = innerHeight;
      center = { x: width / 2, y: height / 2 };
      maxRadius = Math.hypot(width, height) * 0.6;
    }
    window.addEventListener('resize', resize);
    resize();

    function createWave() {
      const gapAngle = Math.random() * Math.PI * 2;
      const gapSize = 0;//Math.PI * (0.3 + Math.random() * 0.4);
      const hue = 190 + Math.random() * 40; // blue/cyan variation
      waves.push({
        startTime: performance.now(),
        gapAngle,
        gapSize,
        hue,
        offX: Math.random(),
        offY: Math.random()
      });
    }

    createWave();

    setTimeout(() => {
      showBox();
    }, 750);


    // Generate 1-99 game links dynamically
    const container = document.getElementById('gameLinks');
    for (let i = 1; i <= 10; i++) {
      const a = document.createElement('a');
      a.href = `game/game.html?room=room${i}`;
      a.textContent = `Wave ${i}`;
      container.appendChild(a);
    }

    // Author name generator
    function generateAuthorName() {
      const titles = ["Mr.", "Mrs.", "Ms.", "Dr.", "Prof."];
      const adjectives = [
        "Eloquent", "Mysterious", "Somber", "Brilliant", "Enigmatic", "Gentle",
        "Brooding", "Inspired", "Melancholic", "Witty", "Stoic", "Dreamy",
        "Vivid", "Arcane", "Noble", "Poetic", "Clever", "Ambitious", "Haunted",
        "Fabled", "Quiet", "Venerable", "Charming", "Daring", "Curious"
      ];
      const firstNames = [
        "Tobias", "Ada", "Lillian", "Oscar", "Julian", "Clara", "Eleanor", "Hugo",
        "Daphne", "Nathaniel", "Rowan", "Sylvia", "Edgar", "Vera", "August",
        "Florence", "Lucian", "Ivy", "Gideon", "Mabel", "Arthur", "Beatrice",
        "Felix", "Cecilia", "Miles"
      ];
      const lastNames = [
        "Quill", "Penwright", "Inkwell", "Thorne", "Austen", "Brontë", "Heming",
        "Wordsworth", "Hawthorne", "Byron", "Poe", "Shelley", "Twain", "Chaucer",
        "Dickens", "Wilde", "Frost", "Lowell", "Whitman", "Melville", "Keats",
        "Tennyson", "Carroll", "Eliot", "Huxley", "Orwell"
      ];
      const rand = arr => arr[Math.floor(Math.random() * arr.length)];
      return `${rand(titles)} ${rand(adjectives)} ${rand(firstNames)} ${rand(lastNames)}`;
    }

    let myName = localStorage.getItem("myName") || generateAuthorName();
    localStorage.setItem("myName", myName);
    document.getElementById("playerName").innerText = myName;

    function updateRandomName() {
      myName = generateAuthorName();
      localStorage.setItem("myName", myName);
      document.getElementById("playerName").innerText = myName;
    }

    document.addEventListener("keydown", (e) => {

      if (e.key == ' ') {
        isPaused = !isPaused;
      }

      if (e.key == 'i') {
        showBox();
      }

      if (e.key == 'o') {
        hideBox();
      }

    })

    let old;

    let isPaused = false;

    setInterval(createWave, SPAWN_INTERVAL);

    function animate(now) {

      if (isPaused) {
        now = old;
      }

      old = now;

      ctx.fillStyle = 'rgba(5,6,10,0.3)'; // faint fade trail
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = 'rgba(130,210,255,0.8)';
      ctx.shadowBlur = GLOW;

      for (const wave of waves) {
        const elapsed = (now - wave.startTime) / 1000;
        const radius = elapsed * SPEED;

        if (radius > maxRadius) continue;
        if (radius < 0) continue;

        const alpha = 1 - radius / maxRadius;
        ctx.lineWidth = 2 + 1.5 * alpha;
        ctx.strokeStyle = `hsla(${wave.hue}, 80%, 70%, ${alpha * 0.9})`;

        // slowly rotate the opening over time
        const rotatedGapAngle = wave.gapAngle + elapsed * ROTATION_SPEED;

        const start = rotatedGapAngle + wave.gapSize / 2;
        const end = rotatedGapAngle - wave.gapSize / 2 + Math.PI * 2;

        ctx.beginPath();
        ctx.arc(center.x + (.5 - wave.offX) * 350, center.y + (.5 - wave.offY) * 350, radius, start, end);
        ctx.stroke();
      }

      // cleanup old waves
      waves = waves.filter(w => (now - w.startTime) / 1000 * SPEED < maxRadius);

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

  </script>
</body>

</html>
