<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, user-select=none">

  <title>Chunked Tile Grid Editor (with Save/Load)</title>
  <style>
    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }

    canvas {
      background: #111;
      display: block;
      margin: auto;
      cursor: crosshair;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      font: 14px monospace;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px;
      border-radius: 4px;
    }

    button {
      background: #444;
      border: 1px solid #666;
      color: #eee;
      margin: 2px;
      padding: 4px 8px;
      cursor: pointer;
    }

    button:hover {
      background: #666;
    }
  </style>
</head>

<body>
  <canvas id="game" width="800" height="600"></canvas>

  <div id="hud">
    <div>Selected Tile: <span id="tileNum">1</span></div>
    <div>Chunks Loaded: <span id="chunkCount">0</span></div>
    <div>
      <button id="saveBtn">💾 Save</button>
      <button id="loadBtn">📂 Load</button>
      <button id="clearBtn">🗑️ Clear</button>
    </div>
    <div style="margin-top:4px;">
      <p>Controls: Arrow keys</p>
      <p>0–6 = color</p>
    </div>
  </div>

  <script>
    const TILE_SIZE = 16;
    const CHUNK_SIZE = 64;
    const WORLD_SIZE = 32000;
    const TILE_COLORS = [
      "#000000", "#4CAF50", "#2196F3",
      "#FFC107", "#E91E63", "#9C27B0", "#FF5722"
    ];

    const chunks = new Map();

    const chunkKey = (cx, cy) => `${cx},${cy}`;

    function getChunk(cx, cy) {
      const key = chunkKey(cx, cy);
      if (!chunks.has(key)) chunks.set(key, new Uint8Array(CHUNK_SIZE * CHUNK_SIZE));
      return chunks.get(key);
    }

    function setTile(col, row, value) {
      const cx = Math.floor(col / CHUNK_SIZE);
      const cy = Math.floor(row / CHUNK_SIZE);
      const chunk = getChunk(cx, cy);
      const lx = col % CHUNK_SIZE;
      const ly = row % CHUNK_SIZE;
      chunk[ly * CHUNK_SIZE + lx] = value;
    }

    function getTile(col, row) {
      const cx = Math.floor(col / CHUNK_SIZE);
      const cy = Math.floor(row / CHUNK_SIZE);
      const chunk = chunks.get(chunkKey(cx, cy));
      if (!chunk) return 0;
      const lx = col % CHUNK_SIZE;
      const ly = row % CHUNK_SIZE;
      return chunk[ly * CHUNK_SIZE + lx];
    }

    // --- Canvas setup ---
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let camX = 0, camY = 0;
    const speed = 500;
    let selectedTile = 1;
    const keys = {};

    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    // Mouse controls
    let mouseDown = false;
    canvas.addEventListener("mousedown", e => { mouseDown = true; paint(e); });
    window.addEventListener("mouseup", () => mouseDown = false);
    canvas.addEventListener("mousemove", e => { if (mouseDown) paint(e); });

    function paint(e) {
      const worldX = camX + e.offsetX;
      const worldY = camY + e.offsetY;
      const col = Math.floor(worldX / TILE_SIZE);
      const row = Math.floor(worldY / TILE_SIZE);
      setTile(col, row, selectedTile);
    }

    // Number keys for tile select
    window.addEventListener("keydown", e => {
      const n = parseInt(e.key);
      if (!isNaN(n) && n >= 0 && n < TILE_COLORS.length) {
        selectedTile = n;
        document.getElementById("tileNum").textContent = n;
      }
    });

    function update(dt) {
      if (keys["ArrowUp"]) camY -= speed * dt;
      if (keys["ArrowDown"]) camY += speed * dt;
      if (keys["ArrowLeft"]) camX -= speed * dt;
      if (keys["ArrowRight"]) camX += speed * dt;

      camX = Math.max(0, Math.min(camX, WORLD_SIZE * TILE_SIZE - canvas.width));
      camY = Math.max(0, Math.min(camY, WORLD_SIZE * TILE_SIZE - canvas.height));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const startCol = Math.floor(camX / TILE_SIZE);
      const startRow = Math.floor(camY / TILE_SIZE);
      const endCol = startCol + Math.ceil(canvas.width / TILE_SIZE);
      const endRow = startRow + Math.ceil(canvas.height / TILE_SIZE);

      for (let row = startRow; row <= endRow; row++) {
        for (let col = startCol; col <= endCol; col++) {
          const tile = getTile(col, row);
          if (tile !== 0) {
            ctx.fillStyle = TILE_COLORS[tile];
            ctx.fillRect(col * TILE_SIZE - camX, row * TILE_SIZE - camY, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      document.getElementById("chunkCount").textContent = chunks.size;
      requestAnimationFrame(draw);
    }

    // --- Save/Load/Clear ---
    function saveWorld() {
      const obj = {};
      for (const [key, chunk] of chunks.entries()) {
        obj[key] = Array.from(chunk);
      }
      localStorage.setItem("tileWorld", JSON.stringify(obj));
      alert("World saved!");
    }

    function loadWorld() {
      const data = localStorage.getItem("tileWorld");
      if (!data) return alert("No saved world found.");
      chunks.clear();
      const obj = JSON.parse(data);
      for (const [key, arr] of Object.entries(obj)) {
        chunks.set(key, Uint8Array.from(arr));
      }
      alert("World loaded!");
    }

    function clearWorld() {
      if (confirm("Clear world?")) {
        chunks.clear();
        localStorage.removeItem("tileWorld");
      }
    }

    document.getElementById("saveBtn").onclick = saveWorld;
    document.getElementById("loadBtn").onclick = loadWorld;
    document.getElementById("clearBtn").onclick = clearWorld;

    // --- Main loop ---
    let lastTime = performance.now();
    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      update(dt);
      requestAnimationFrame(loop);
    }

    draw();
    loop(lastTime);
  </script>
</body>

</html>
