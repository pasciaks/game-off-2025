  <style>
    * {
      text-align: center;
    }

    .my-li:hover {
      background-color: teal;
    }

    .my-li:active {
      background-color: lightblue;
      /* when clicked */
      transform: scale(0.77);
      /* optional "press" effect */
    }

    #waveslist {
      display: block;
      width: 100%;
    }

    /* Toast container */
    #toast-container {
      position: fixed;
      top: 100px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Toast style */
    .toast {
      display: flex;
      align-items: center;
      min-width: 250px;
      max-width: 350px;
      padding: 15px 20px;
      border-radius: 8px;
      color: #fff;
      font-family: sans-serif;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
      position: relative;
    }

    /* Toast types */
    .toast.success {
      background-color: #4CAF50;
    }

    .toast.error {
      background-color: #F44336;
    }

    .toast.info {
      background-color: #2196F3;
    }

    .toast.warning {
      background-color: #FFC107;
      color: #333;
    }

    /* Show toast */
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Close button */
    .toast .close-btn {
      margin-left: auto;
      cursor: pointer;
      font-weight: bold;
      padding-left: 10px;
    }

    dialog {
      background-color: #0099ff;
      border: none;
      border-radius: 32px;
      padding: 5px;
      width: 95%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      ;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    #commands {
      background-color: rgb(0, 0, 0);
      border-bottom: 2px solid blue;
    }

    #commands button {
      padding: 5px;

      margin-top: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;

    }





    .waterButton {
      position: relative;
      display: inline-block;
      padding: 4px 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e8faff;
      width: 50%;
      background: linear-gradient(180deg, #0099ff 0%, #0066cc 100%);
      border: 5px solid rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.4);
      text-shadow: 0 1px 3px rgba(0, 0, 30, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .waterButtonNo {
      position: relative;
      display: inline-block;
      padding: 4px 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e8faff;
      /* width: 50%; */
      background: linear-gradient(180deg, #0099ff 0%, #0066cc 100%);
      border: 5px solid rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.4);
      text-shadow: 0 1px 3px rgba(0, 0, 30, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      width: 200px;
    }

    /* Rippling layer */
    .waterButton::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.25), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.2), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255, 255, 255, 0.15), transparent 25%),
        radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.15), transparent 25%);
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: rippleMove 8s linear infinite;
      mix-blend-mode: overlay;
      opacity: 0.8;
    }

    /* Subtle shimmer */
    .waterButton::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%);
      opacity: 0;
      transform: translateX(-100%);
      transition: opacity 0.4s, transform 0.8s;
    }

    /* Hover effects */
    .waterButton:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.6);
    }

    .waterButton:hover::after {
      opacity: 1;
      transform: translateX(100%);
    }

    /* Click feedback */
    .waterButton:active {
      transform: scale(0.97);
    }

    /* Rippling motion */
    @keyframes rippleMove {
      0% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, -15px);
      }

      100% {
        transform: translate(0, 0);
      }
    }
  </style>

    // 🎚️ Volume control (0.0 — 1.0)

      }
    }

    function playAudioToggle(filename) {
      // First time playing or new file requested
      if (!currentAudio || currentFile !== filename) {
        // Stop old audio if any
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        currentFile = filename;
        currentAudio = new Audio(filename);
        currentAudio.loop = true;
        currentAudio.play().catch(err => console.error("Audio play error:", err));
        return;
      }

      // Toggle play/pause for the same file
      if (currentAudio.paused) {
        currentAudio.play().catch(err => console.error("Audio resume error:", err));
      } else {
        currentAudio.pause();
        currentAudio.currentTime = 0; // restart if played again
      }
    }

    function playAudio(filename) {
      // Stop previous audio if playing
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      // Create new audio element
      currentAudio = new Audio(filename);
      currentAudio.loop = true; // Enable repeat
      currentAudio.play()
        .catch(err => console.error('Error playing audio:', err));
    }

    function showToast(message, type = 'info', duration = 3000) {
      const container = document.getElementById('toast-container');

      // Create toast element
      const toast = document.createElement('div');
      toast.classList.add('toast', type);
      toast.innerHTML = `
      <span>${message}</span>
      <span class="close-btn">&times;</span>
    `;

      // Append to container
      container.appendChild(toast);

      // Show with animation
      setTimeout(() => toast.classList.add('show'), 100);

      // Remove toast after duration
      const removeToast = () => {
        toast.classList.remove('show');
        setTimeout(() => container.removeChild(toast), 400);
      };

      // Auto remove after duration
      const timeoutId = setTimeout(removeToast, duration);

      // Close button event
      toast.querySelector('.close-btn').addEventListener('click', () => {
        clearTimeout(timeoutId);
        removeToast();
      });
    }

    function shuffleInPlace(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    /**
     * Helper to generate a unique key for a given tile coordinate.
     */
    function tileKey(col, row) {
      return `${col},${row}`;
    }

    /**
     * Get a tile object at a specific grid coordinate.
     * If none exists yet, returns a default tile object.
     * @param {number} col
     * @param {number} row
     * @returns {{col:number, row:number, letter:string, color:string, status:string}}
     */
    function getTile(col, row) {
      const key = tileKey(col, row);
      if (!tileMap.has(key)) {
        // Lazy-generate a new tile with defaults
        const newTile = {
          col,
          row,
          letter: "_",
          color: 'cyan', // getTileColor(col, row),
          status: "empty"
        };
        tileMap.set(key, newTile);
      }
      return tileMap.get(key);
    }

    function getProposedTile(col, row) {

        const newTile = {

          row,
          letter: "_",
          color: 'cyan', // getTileColor(col, row),
          status: "empty"
        };
        proposedTileMap.set(key, newTile);
      }
      return proposedTileMap.get(key);
    }

    /**
     * Set or update a tile object in the map.
     * @param {number} col
     * @param {number} row
     * @param {{col:number,row:number,letter:string,color:string,status:string}} tileObj
     */
    function setTile(col, row, tileObj) {
      if (!tileObj?.type) { tileObj.type = 'normal'; }

      const key = tileKey(col, row);
      // Merge given tileObj with col,row and store
      const updated = { col, row, ...tileObj };
      tileMap.set(key, updated);
    }

    function createWave() {
      const wavePoints = [];
      const resolution = 25; // col range -25..25
      const step = 1; // step size
      const amplitude = 10; // max wave height

      for (let col = -resolution; col <= resolution; col += step) {
        // sine wave formula
        const rowValue = 10 * Math.sin((col / resolution) * 2 * Math.PI);
        const row = Math.round(rowValue);

        // Fill in from 0 up to row (handles positive and negative waves)
        if (row >= 0) {
          for (let r = 0; r <= row; r++) {
            wavePoints.push({ col, row: r });
          }
        } else {
          for (let r = 0; r >= row; r--) {
            wavePoints.push({ col, row: r });
          }
        }
      }

      return wavePoints;
    }

      if (!tto || typeof tto.col !== 'number' || typeof tto.row !== 'number') return false;

      // Check if the point exists in the wavePoints
      const existsInWave = theWaveArea.some(
        point => point.col === tto.col && point.row === tto.row
      );

      if (!existsInWave) return true;

      // Original rules
      if ((tto.col + tto.row) % 8 === 0) {
        if (tto.row % 25 === 0) {
          return true;
        }
      }
      if (tto.col > 5 && tto.col < 15) {
        return true;
      }

      return false;
    }

      } else if (e.touches.length === 2) {
        // Pinch zoom start
        isDragging = false;
        const [t1, t2] = e.touches;
        lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        touchStartMid = {
          x: (t1.clientX + t2.clientX) / 2,

        const mid = {

          y: (t1.clientY + t2.clientY) / 2

        // Zoom around midpoint
        const zoomFactor = dist / lastTouchDist;
        const newZoom = Math.min(4, Math.max(0.25, touchCameraStart.zoom * zoomFactor));
        const zoomChange = newZoom / touchCameraStart.zoom;

        cameraX = touchCameraStart.x + (mid.x - touchStartMid.x) / newZoom / zoomChange;

    function createShapeCoords(type = 'wave') {
      const crossPositions = [];



      switch (type) {

        case 'room8':
          // console.log("room8");

          // Create a checkerboard pattern
          const squareSize = 10;  // each square's width/height
          const min = -50;
          const max = 50;

          for (let col = min; col <= max; col++) {
            for (let row = min; row <= max; row++) {
              // Determine which 15x15 square we're in
              const colBlock = Math.floor((col - min) / squareSize);
              const rowBlock = Math.floor((row - min) / squareSize);

              // Alternate filled/empty based on parity
              let isFilled = (colBlock + rowBlock) % 2 === 0;

              if (col % 10 == 0 || row % 10 == 0) { isFilled = false }
              if (col % 5 == 0 || row % 5 == 0) { isFilled = false }

              if (isFilled) {
                crossPositions.push({ col, row });
              }

            }
          }

          break;

        case 'room9':
          // Create a thick circular ring pattern
          // Uses a center at (0, 0) and radius ~30
          let radius = 15;
          thickness = 3; // adjust to make the ring thicker
          for (let col = -50; col <= 50; col++) {
            for (let row = -50; row <= 50; row++) {
              const distance = Math.sqrt(col * col + row * row);
              // Keep points near the circle edge (thick ring)
              if (distance >= radius - thickness && distance <= radius + thickness) {
                crossPositions.push({ col, row });
              }
            }
          }
          break;

        case 'room10':
          // Create a sine wave pattern
          // col from -50 to 50, row calculated from sine
          for (let col = -50; col <= 50; col++) {
            // Adjust amplitude and frequency here
            let amplitude = 10;      // vertical height of the wave
            let frequency = 0.25;     // wave tightness (lower = longer wave)
            let row = Math.round(Math.sin(col * frequency) * amplitude);
            crossPositions.push({ col, row });
            crossPositions.push({ col, row: row + 1 });
            crossPositions.push({ col, row: row + 2 });
            let frequency2 = 0.15;     // wave tightness (lower = longer wave)
            let row2 = Math.round(Math.sin(col * frequency2) * amplitude);
            crossPositions.push({ col: col, row: row2 + 25 });
            crossPositions.push({ col: col, row: row2 + 26 });
            crossPositions.push({ col: col, row: row2 + 27 });
          }
          break;
        case 'room7':
          // Vertical bar (col = 0, row from -10 to 10)
          for (let row = -10; row <= 10; row++) {
            crossPositions.push({ col: 0, row });
          }
          // Horizontal bar (row = 0, col from -5 to 5)
          for (let col = -5; col <= 5; col++) {
            // Avoid duplicating the center cell {0,0}
            if (col !== 0) crossPositions.push({ col, row: -5 });
          }
          break;
        default:
          break;
      }

      return crossPositions;
    }

          ctx.strokeRect(jj, (canvas.height / 4) / zoom + (canvas.height / 4) / zoom + (canvas.height / 4) / zoom + Math.sin((off3 * 5 + jj) / 125) * 125, 1, 1000);
        }
        // ctx.strokeRect(0, 0, canvas.width / zoom, canvas.height / zoom);
      } else {
        canFloat = false;
      }

      if (isCheatMode) { canFloat = true; }

      ctx.restore();
    }

    setTimeout(() => {
      startWatchingName("");
    }, 500)

    // --- Animation loop ---
    function loop() {
      updateCamera();
      draw();
      requestAnimationFrame(loop);
    }

    function startTheGame() {


      // playSound('gem_collect.wav');
      requestAnimationFrame(loop);
    }

    if ("wakeLock" in navigator) {
      console.log("WakeLock supported");

      keepAwake();

    } else {
      console.log("WakeLock NOT supported");
    }


    let wakeLock = null;

    async function keepAwake() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        console.log("Wake lock active");

        // Re-acquire lock if it is released (e.g., when tab loses focus)
        document.addEventListener("visibilitychange", async () => {
          if (wakeLock !== null && document.visibilityState === "visible") {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        });
      } catch (err) {
        console.error(`Wake lock failed: ${err.name}, ${err.message}`);
      }
    }
