    * {

    /* Toast container */
    #toast-container {
      position: fixed;
      top: 60px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Toast style */
    .toast {
      display: flex;
      align-items: center;
      min-width: 250px;
      max-width: 350px;
      padding: 15px 20px;
      border-radius: 8px;
      color: #fff;
      font-family: sans-serif;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
      position: relative;
    }

    /* Toast types */
    .toast.success {
      background-color: #4CAF50;
    }

    .toast.error {
      background-color: #F44336;
    }

    .toast.info {
      background-color: #2196F3;
    }

    .toast.warning {
      background-color: #FFC107;
      color: #333;
    }

    /* Show toast */
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Close button */
    .toast .close-btn {
      margin-left: auto;
      cursor: pointer;
      font-weight: bold;
      padding-left: 10px;
    }

    dialog {
      background-color: #0099ff;
      border: none;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    #commands {
      background-color: rgb(0, 0, 0);
    }

    #commands button {
      padding: 5px;

      margin-top: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;

    }





    .waterButton {
      position: relative;
      display: inline-block;
      padding: 4px 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e8faff;
      background: linear-gradient(180deg, #0099ff 0%, #0066cc 100%);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.4);
      text-shadow: 0 1px 3px rgba(0, 0, 30, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    /* Rippling layer */
    .waterButton::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.25), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.2), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255, 255, 255, 0.15), transparent 25%),
        radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.15), transparent 25%);
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: rippleMove 8s linear infinite;
      mix-blend-mode: overlay;
      opacity: 0.8;
    }

    /* Subtle shimmer */
    .waterButton::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%);
      opacity: 0;
      transform: translateX(-100%);
      transition: opacity 0.4s, transform 0.8s;
    }

    /* Hover effects */
    .waterButton:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.6);
    }

    .waterButton:hover::after {
      opacity: 1;
      transform: translateX(100%);
    }

    /* Click feedback */
    .waterButton:active {
      transform: scale(0.97);
    }

    /* Rippling motion */
    @keyframes rippleMove {
      0% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, -15px);
      }

      100% {
        transform: translate(0, 0);
      }
    }
  </style>

    function playAudioToggle(filename) {
      // First time playing or new file requested
      if (!currentAudio || currentFile !== filename) {
        // Stop old audio if any
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        currentFile = filename;
        currentAudio = new Audio(filename);
        currentAudio.loop = true;
        currentAudio.play().catch(err => console.error("Audio play error:", err));
        return;
      }

      // Toggle play/pause for the same file
      if (currentAudio.paused) {
        currentAudio.play().catch(err => console.error("Audio resume error:", err));
      } else {
        currentAudio.pause();
        currentAudio.currentTime = 0; // restart if played again
      }
    }

    function playAudio(filename) {
      // Stop previous audio if playing

        currentAudio.pause();
        currentAudio.currentTime = 0;

      currentAudio.loop = true; // Enable repeat

        toast.classList.remove('show');

    /**
     * Helper to generate a unique key for a given tile coordinate.
     */
    function tileKey(col, row) {
      return `${col},${row}`;
    }

    /**
     * Get a tile object at a specific grid coordinate.
     * If none exists yet, returns a default tile object.
     * @param {number} col
     * @param {number} row
     * @returns {{col:number, row:number, letter:string, color:string, status:string}}
     */
    function getTile(col, row) {
      const key = tileKey(col, row);
      if (!tileMap.has(key)) {
        // Lazy-generate a new tile with defaults
        const newTile = {
          col,
          row,
          letter: "_",
          color: 'cyan', // getTileColor(col, row),
          status: "empty"
        };
        tileMap.set(key, newTile);
      }
      return tileMap.get(key);
    }

    function getProposedTile(col, row) {
      const key = tileKey(col, row);
      if (!proposedTileMap.has(key)) {
        // Lazy-generate a new tile with defaults
        const newTile = {
          col,
          row,
          letter: "_",
          color: 'cyan', // getTileColor(col, row),
          status: "empty"
        };
        proposedTileMap.set(key, newTile);
      }
      return proposedTileMap.get(key);
    }

    /**
     * Set or update a tile object in the map.
     * @param {number} col
     * @param {number} row
     * @param {{col:number,row:number,letter:string,color:string,status:string}} tileObj
     */
    function setTile(col, row, tileObj) {
      if (!tileObj?.type) { tileObj.type = 'normal'; }

      const key = tileKey(col, row);
      // Merge given tileObj with col,row and store
      const updated = { col, row, ...tileObj };
      tileMap.set(key, updated);
    }

    function createWave() {
      const wavePoints = [];
      const resolution = 25; // col range -25..25
      const step = 1; // step size
      const amplitude = 10; // max wave height

      for (let col = -resolution; col <= resolution; col += step) {
        // sine wave formula
        const rowValue = 10 * Math.sin((col / resolution) * 2 * Math.PI);
        const row = Math.round(rowValue);

        // Fill in from 0 up to row (handles positive and negative waves)
        if (row >= 0) {
          for (let r = 0; r <= row; r++) {
            wavePoints.push({ col, row: r });
          }
        } else {
          for (let r = 0; r >= row; r--) {
            wavePoints.push({ col, row: r });
          }
        }
      }

      return wavePoints;
    }

    function isValidPlace(tto) {
      // Ensure tto exists and has col and row
      if (!tto || typeof tto.col !== 'number' || typeof tto.row !== 'number') return false;

      // Check if the point exists in the wavePoints
      const existsInWave = theWaveArea.some(
        point => point.col === tto.col && point.row === tto.row
      );

      if (!existsInWave) return true;

      // Original rules
      if ((tto.col + tto.row) % 8 === 0) {
        if (tto.row % 25 === 0) {
          return true;
        }
      }
      if (tto.col > 5 && tto.col < 15) {
        return true;
      }

      return false;
    }

    function drawLetterTile(ctx, theTileData, x, y, optionOverride) {
      let letter = theTileData.letter;
      letter = letter.toUpperCase();
      let shrink = 0;
      // Find tile position in grid
      for (let row = 0; row < TILE_ROWS; row++) {
        const col = TILE_ORDER[row].indexOf(letter);
        if (col !== -1) { // this is regarding tile sprite images only
          const sx = col * TILE_SIZE;
          const sy = row * TILE_SIZE;

          if (optionOverride) {
            // tileProoposedImage
            ctx.drawImage(
              tileProoposedImage,
              sx + 1, sy + 1, TILE_SIZE - 2, TILE_SIZE - 2,
              x + shrink, y + shrink, TILE_SIZE - shrink * 2, TILE_SIZE - shrink * 2
            );

            // ctx.fillText(theTileData?.type, x + shrink + 15, y + shrink + 15);

            // out of bounds areas ? water traps, etc
            if (!isValidPlace(theTileData)) {
              shrink = 2;
              ctx.fillStyle = 'black';
              ctx.fillRect(x + shrink, y + shrink, TILE_SIZE - shrink * 2, TILE_SIZE - shrink * 2);
            }

            return;

          } else {

            ctx.drawImage(
              tileImage,
              sx + 1, sy + 1, TILE_SIZE - 2, TILE_SIZE - 2,
              x + shrink, y + shrink, TILE_SIZE - shrink * 2, TILE_SIZE - shrink * 2

      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
        keysPressed[e.key] = false;
      }
    });

    function navigateView(col, row) {
      // Tile top-left in world coords
      let tileX = col * TILE;
      let tileY = row * TILE;

      // Offset so the tile center aligns with canvas center
      cameraX = tileX - (canvas.width / 2 / zoom) + TILE / 2;
      cameraY = tileY - (canvas.height / 2 / zoom) + TILE / 2;
    }


    // Update camera per frame
    function updateCamera() {
      const baseSpeed = 5; // pixels per frame at zoom = 1
      const speed = baseSpeed / zoom; // adjust for zoom level

      if (keysPressed["ArrowLeft"]) cameraX -= speed;
      if (keysPressed["ArrowRight"]) cameraX += speed;
      if (keysPressed["ArrowUp"]) cameraY -= speed;
      if (keysPressed["ArrowDown"]) cameraY += speed;
    }




    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      cameraStartX = cameraX;
      cameraStartY = cameraY;
      captureCoords(e)
      // console.log({ dragStartX, dragStartY });
    });

    window.addEventListener("mouseup", () => isDragging = false);

    window.addEventListener("mousemove", (e) => {

      if (isDragging) {
        const dx = (e.clientX - dragStartX) / zoom;
        const dy = (e.clientY - dragStartY) / zoom;
        cameraX = cameraStartX - dx;
        cameraY = cameraStartY - dy;
        //if (cameraX<-2000) { cameraX=-2000; }
        //if (cameraX>2000) { cameraX=2000; }
        //if (cameraY<-2000) { cameraY=-2000; }
        //if (cameraY>2000) { cameraY=2000; }
        // console.log({ dx, dy, cameraX, cameraY });
        // console.log({ x: e.clientX, y: e.clientY });

        // console.log(getTileItem(((e.clientX + cameraX)), ((e.clientY + cameraY))));

        // how to determine row and col of where i'm dragging in relation to TILE, and camera???

        captureCoords(e);

      }
    });

    // --- Touch handling (drag + pinch zoom) ---
    let lastTouchDist = null;
    let touchStartMid = null;
    let touchCameraStart = null;

    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        // Single finger drag
        const t = e.touches[0];
        // captureCoords(t, true);
        isDragging = true;
        dragStartX = t.clientX;
        dragStartY = t.clientY;
        cameraStartX = cameraX;
        cameraStartY = cameraY;
      } else if (e.touches.length === 2) {
        // Pinch zoom start
        isDragging = false;
        const [t1, t2] = e.touches;
        lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        touchStartMid = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
        // console.log({ x, y });
        touchCameraStart = { x: cameraX, y: cameraY, zoom };
      }
    });

    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDragging) {
        const t = e.touches[0];
        //captureCoords(t, false);
        const dx = (t.clientX - dragStartX) / zoom;
        const dy = (t.clientY - dragStartY) / zoom;
        cameraX = cameraStartX - dx;
        cameraY = cameraStartY - dy;
      } else if (e.touches.length === 2) {
        const [t1, t2] = e.touches;
        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const mid = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };

        // Zoom around midpoint
        const zoomFactor = dist / lastTouchDist;
        const newZoom = Math.min(4, Math.max(0.25, touchCameraStart.zoom * zoomFactor));
        const zoomChange = newZoom / touchCameraStart.zoom;

        cameraX = touchCameraStart.x + (mid.x - touchStartMid.x) / newZoom / zoomChange;
        cameraY = touchCameraStart.y + (mid.y - touchStartMid.y) / newZoom / zoomChange;
        zoom = newZoom;
      }
      //captureCoords(t, false);
    });

    // TODO: CHECK AND VERIFY THAT TOUCH UPDATES REMOTE PLAYER POSITIONS...

    canvas.addEventListener("touchend", (e) => {
      if (event.touches.length === 0) {
        isDragging = false;
        lastTouchDist = null;
      }
    });

    // Optional mouse wheel zoom (desktop)
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.min(4, Math.max(0.25, zoom * zoomFactor));

      // Zoom around mouse position
      const mx = e.clientX;
      const my = e.clientY;
      cameraX += (mx / zoom - mx / newZoom);
      cameraY += (my / zoom - my / newZoom);
      zoom = newZoom;
    }, { passive: false });

    function randomLetter() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ_';
      return letters[Math.floor(Math.random() * letters.length)];
    }

    function setLetters() {
      for (let i = -25; i < 25; i++) {
        for (let j = -25; j < 25; j++) {
          setTile(i, j, { letter: '_' });
          if (Math.random() > .98) {
            setTile(i, j, { letter: randomLetter() });
          }
        }
      }
    }

    function draw() {

      ctx.fillStyle = 'black';

      ctx.fillRect(0, 0, canvas.width, canvas.height); // fill, not clearRect

      //ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(zoom, zoom);

      const startX = Math.floor(cameraX / TILE);
      const startY = Math.floor(cameraY / TILE);
      const endX = Math.ceil((cameraX + canvas.width / zoom) / TILE);
      const endY = Math.ceil((cameraY + canvas.height / zoom) / TILE);

      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "white";

      playerX = playerCol * TILE - cameraX;
      playerY = playerRow * TILE - cameraY;

      // actual tiles
      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          const px = x * TILE - cameraX;
          const py = y * TILE - cameraY;

          let theTile = getTile(x, y);

          let colBoundary = boardColsMagnitude;
          let rowBoundary = boardRowsMagnitude;

          // drawLetterTile(ctx, '_', px, py);

          if (theTile && theTile.letter !== "~" && theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) { // "_"

            if (theTile?.letter == "_") {
              drawLetterTile(ctx, theTile, px, py, true);
            } else {
              drawLetterTile(ctx, theTile, px, py);
            }

            ctx.lineWidth = 3;
            ctx.strokeStyle = "white"
            if (theTile.isSelected == true) { ctx.strokeRect(px + 6, py + 6, 64 - 12, 64 - 12) }
          } else {
            // if (theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) {
            //drawLetterTile(ctx, '_', px, py);
            //}
          }

          // Draw tile border
          // ctx.strokeStyle = "red";
          // ctx.lineWidth = 2;
          // ctx.strokeRect(px, py, TILE, TILE);

          // if (theTile?.type != 'normal') {
          ctx.strokeStyle = 'transparent';
          if (theTile?.type == 'crimewave') {
            ctx.strokeStyle = 'blue';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("🕵️‍♂️", px + TILE / 8, py + TILE / 8);
          }
          if (theTile?.type == 'shockwave') {
            ctx.strokeStyle = 'green';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("⚡", px + TILE / 8, py + TILE / 8);
          }
          if (theTile?.type == 'brainwave') {
            ctx.strokeStyle = 'red';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("🧠", px + TILE / 8, py + TILE / 8);
          }
          // }

          // Draw col,row centered on tile
          if (canCommitCrime) {
            if (theTile.letter != "_") {
              ctx.strokeStyle = 'blue';
              ctx.lineWidth = 5;
              ctx.strokeRect(px, py, TILE, TILE);
            }
          }

          if (canReplace) {
            if (theTile.letter != "_") {
              ctx.strokeStyle = 'green';
              ctx.lineWidth = 5;
              ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            }
          }

          // if (x == playerCol) {
          //   playerX = px;
          // }

          // if (y == playerRow) {
          //   playerY = py;
          // }

        }
      }


      // proposed tiles
      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          const px = x * TILE - cameraX;
          const py = y * TILE - cameraY;

          let theTile = getProposedTile(x, y);

          // console.log(theTile.letter)

          let colBoundary = boardColsMagnitude;
          let rowBoundary = boardRowsMagnitude;

          // drawLetterTile(ctx, '_', px, py);

          if (theTile && theTile.letter !== "_" && theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) { // "_"
            drawLetterTile(ctx, theTile, px, py, true); // override draw to use proposed tile drawing image
            ctx.lineWidth = 3;
            ctx.strokeStyle = "white"
            if (theTile.isSelected == true) { ctx.strokeRect(px + 6, py + 6, 64 - 12, 64 - 12) }
          } else {
            // if (theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) {
            //drawLetterTile(ctx, '_', px, py);
            //}
          }

          //ctx.fillText(`${x},${y}`, px, py);

        }
      }



      users.forEach((u) => {

        //console.log(u);

        let cplayerX = u.playerCol * TILE - cameraX;
        let cplayerY = u.playerRow * TILE - cameraY;

        let nickname = u?.nickname || "Unknown";

        ctx.font = "18px Arial";

        // if ((u?.dateTime)) {
        //   ctx.fillText(u.dateTime, cplayerX - 22, cplayerY - 32);
        // }

        if (nickname == myName) {
          ctx.fillStyle = 'black';
        } else {
          ctx.fillStyle = 'yellow';
        }

        if (nickname != myName && (Date.now() - u.dateTime) > 15000) {

        } else {
          ctx.drawImage(playerImage, cplayerX - 22, cplayerY - 22);

          if ((Date.now() - u.dateTime) < 1000) {
            ctx.fillText(nickname, cplayerX + TILE / 2, cplayerY + TILE / 2);
          }

        }

        if (nickname == myName) {

          if (lastDirectionXY.x > 0) {
            ctx.font = "40px courier";
            ctx.fillStyle = 'white';
            // ctx.fillRect(cplayerX + 25, cplayerY + 1, 15, 15);
            ctx.fillText("→", cplayerX + TILE / 2, cplayerY + TILE / 2)
          }

          if (lastDirectionXY.y > 0) {
            ctx.font = "40px courier";
            ctx.fillStyle = 'white';
            // ctx.fillRect(cplayerX + 1, cplayerY + 25, 15, 15);
            ctx.fillText("↓", cplayerX + TILE / 2, cplayerY + TILE / 2)
          }

        }

        // ctx.drawImage(playerImage, cplayerX - 22, cplayerY - 22);
        // ctx.fillText(nickname, cplayerX - 22, cplayerY - 22);

      });

      //ctx.drawImage(playerImage, playerX - 22, playerY - 22);

      ctx.restore();
    }


    // --- Animation loop ---
    function loop() {
      updateCamera();
      draw();
      requestAnimationFrame(loop);
    }

  </script>
