  <style>
    * {
      text-align: center;
    }

    #waveslist {
      display: block;
      width: 100%;
    }

    /* Toast container */
    #toast-container {
      position: fixed;
      top: 120px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Toast style */
    .toast {
      display: flex;
      align-items: center;
      min-width: 250px;
      max-width: 350px;
      padding: 15px 20px;
      border-radius: 8px;
      color: #fff;
      font-family: sans-serif;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
      position: relative;
    }

    /* Toast types */
    .toast.success {
      background-color: #4CAF50;
    }

    .toast.error {
      background-color: #F44336;
    }

    .toast.info {
      background-color: #2196F3;
    }

    .toast.warning {
      background-color: #FFC107;
      color: #333;
    }

    /* Show toast */
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Close button */
    .toast .close-btn {
      margin-left: auto;
      cursor: pointer;
      font-weight: bold;
      padding-left: 10px;
    }

    dialog {
      background-color: #0099ff;
      border: none;
      border-radius: 32px;
      padding: 10px;
      width: 80%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      ;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    #commands {
      background-color: rgb(0, 0, 0);
    }

    #commands button {
      padding: 5px;

      margin-top: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;

    }





    .waterButton {
      position: relative;
      display: inline-block;
      padding: 4px 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e8faff;
      width: 50%;
      background: linear-gradient(180deg, #0099ff 0%, #0066cc 100%);
      border: 5px solid rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.4);
      text-shadow: 0 1px 3px rgba(0, 0, 30, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .waterButtonNo {
      position: relative;
      display: inline-block;
      padding: 4px 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e8faff;
      /* width: 50%; */
      background: linear-gradient(180deg, #0099ff 0%, #0066cc 100%);
      border: 5px solid rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.4);
      text-shadow: 0 1px 3px rgba(0, 0, 30, 0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      width: 200px;
    }

    /* Rippling layer */
    .waterButton::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.25), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.2), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255, 255, 255, 0.15), transparent 25%),
        radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.15), transparent 25%);
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: rippleMove 8s linear infinite;
      mix-blend-mode: overlay;
      opacity: 0.8;
    }

    /* Subtle shimmer */
    .waterButton::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%);
      opacity: 0;
      transform: translateX(-100%);
      transition: opacity 0.4s, transform 0.8s;
    }

    /* Hover effects */
    .waterButton:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.6);
    }

    .waterButton:hover::after {
      opacity: 1;
      transform: translateX(100%);
    }

    /* Click feedback */
    .waterButton:active {
      transform: scale(0.97);
    }

    /* Rippling motion */
    @keyframes rippleMove {
      0% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, -15px);
      }

      100% {
        transform: translate(0, 0);
      }
    }
  </style>
</head>

    document.getElementById("waveslist").title = " " + wavesWordsList + " ";

    function showWaveInstructions(whichWave) {

      console.log(whichWave);

      showToast("If enabled, waves will be invoke randomly after successfully placing a word.", "info", 9999);

      switch (whichWave) {
        case "microWave":
          break;
        case "radioWave":
          break;
        case "soundWave":
          break;
        case "ElectromagneticWave":
          break;
        case "energyWave":
          break;
        default:
          break;
      }

      window.open("https://github.com/pasciaks/game-off-2025?tab=readme-ov-file#instructions-about-waves");
    }

    function checkForEndOfBonus() {

      let vv = document.getElementById('waveslist').value;
      let tt = document.getElementById('waveslist').title;

      console.log(vv);
      console.log(tt);

      let vv_hasNoLetters = !/[a-z]/i.test(vv);
      let tt_hasNoLetters = !/[a-z]/i.test(tt);

      if (vv_hasNoLetters && tt_hasNoLetters) {
        showToast("All bonus words have been found!", "success");
      }

    }

    setTimeout(() => {
      document.getElementById('eraseIt').style.display = "block";
    }, 300000);

    function resetGameSaves() {

      if (confirm("Are you sure you want to reset your score and saved crime/shock/brain wave counts?")) {
        localStorage.clear();
        window.location.reload();
      }

    }

    let wavesEnabled = false;

    function toggleEnableWaves() {

      wavesEnabled = !wavesEnabled;

      const toggleBtn = document.getElementById('toggleEnableWaves');

      if (wavesEnabled) {
        // showToast("Wave types activated: Microwave, RadiO, SounD, ElectromagnetiC, EnergY.", "info", 9999);


        toggleBtn.innerText = '⚡ Waves ACTIVE — Click to deactivate all wave types ⚡';
        toggleBtn.style.cssText = `
    background: linear-gradient(135deg, #0ff, #09f, #90f);
    color: white;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    font-weight: bold;
    font-size: 1.2em;
    border: 3px solid #0ff;
    border-radius: 14px;
    padding: 14px 28px;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
    transition: all 0.3s ease;
    animation: energyPulse 1.5s infinite alternate;
    cursor: pointer;
  `;
        updateWaves();
      } else {
        toggleBtn.innerText = '💤 Waves DISABLED — Click to enable wave types';
        toggleBtn.style.cssText = `
    background: linear-gradient(135deg, #222, #333, #444);
    color: #bbb;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    font-size: 1.1em;
    border: 2px solid #555;
    border-radius: 14px;
    padding: 14px 28px;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 0 10px rgba(0,0,0,0.6);
    text-shadow: none;
    transition: all 0.3s ease;
    cursor: pointer;
  `;
        is_microWave = false;
        is_radioWave = false;
        is_soundWave = false;
        is_ElectromagneticWave = false;
        is_energyWave = false;
        // showToast("Waves are NOT enabled.", "info", 9999);
        updateWaves();




      }

      //   showToast("Waves are enabled.", "info", 9999);
      //   document.getElementById('toggleEnableWaves').innerText = '〰️ Waves are On - Click to turn Off Waves 〰️';
      //   document.getElementById('toggleEnableWaves').style.border = '15px solid blue';
      //   updateWaves();
      // } else {
      //   document.getElementById('toggleEnableWaves').innerText = '〰️ Waves are Off - Click to turn On Waves 〰️';
      //   document.getElementById('toggleEnableWaves').style.border = 'none';
      //   is_microWave = false;
      //   is_radioWave = false;
      //   is_soundWave = false;
      //   is_ElectromagneticWave = false;
      //   is_energyWave = false;
      //   showToast("Waves are NOT enabled.", "info", 9999);
      //   updateWaves();
      // }

      if (wavesEnabled) {
        document.getElementById('microWave').classList.add('waves');
        document.getElementById('radioWave').classList.add('waves');
        document.getElementById('soundWave').classList.add('waves');
        document.getElementById('ElectromagneticWave').classList.add('waves');
        document.getElementById('energyWave').classList.add('waves');

        document.getElementById('microWave').classList.remove('noWaves');
        document.getElementById('radioWave').classList.remove('noWaves');
        document.getElementById('soundWave').classList.remove('noWaves');
        document.getElementById('ElectromagneticWave').classList.remove('noWaves');
        document.getElementById('energyWave').classList.remove('noWaves');

      } else {

        document.getElementById('radioWave').classList.remove('waves');
        document.getElementById('soundWave').classList.remove('waves');
        document.getElementById('ElectromagneticWave').classList.remove('waves');
        document.getElementById('energyWave').classList.remove('waves');

        document.getElementById('microWave').classList.add('noWaves');
        document.getElementById('radioWave').classList.add('noWaves');
        document.getElementById('soundWave').classList.add('noWaves');
        document.getElementById('ElectromagneticWave').classList.add('noWaves');

    let is_radioWave = false;
    let is_soundWave = false;
    let is_ElectromagneticWave = false;
    let is_energyWave = false;

    function updateWaves() {

      if (!wavesEnabled) {
        is_microWave = false;
        is_radioWave = false;
        is_soundWave = false;
        is_ElectromagneticWave = false;
        is_energyWave = false;
      }

      if (is_microWave) {

      } else {

      }

      if (is_radioWave) {

      } else {
        document.getElementById('radioWave').classList.remove("active");
      }

      if (is_soundWave) {
        document.getElementById('soundWave').classList.add("active");
      } else {
        document.getElementById('soundWave').classList.remove("active");
      }

      if (is_ElectromagneticWave) {
        document.getElementById('ElectromagneticWave').classList.add("active");
      } else {
        document.getElementById('ElectromagneticWave').classList.remove("active");
      }

      if (is_energyWave) {
        document.getElementById('energyWave').classList.add("active");
      } else {
        document.getElementById('energyWave').classList.remove("active");
      }
    }

    is_microWave = false; updateWaves();
    is_radioWave = false; updateWaves();
    is_soundWave = false; updateWaves();
    is_ElectromagneticWave = false; updateWaves();
    is_energyWave = false; updateWaves();

    let canCommitCrime = false; // crime
    let canReplace = false; // shock
    let canSwap = false; // brain

    function getAndSetLocal(key, value) {
      value = Math.floor(localStorage.getItem(key) || value);
      localStorage.setItem(key, value);
      return value;
    }

    function justSetLocal(key, value) {
      localStorage.setItem(key, value);
      return value;
    }



    let gravityCount = getAndSetLocal('gravityCount', 1);//1;
    let crimeCount = getAndSetLocal('crimeCount', 1);//1;
    let shockCount = getAndSetLocal('shockCount', 3);//3;
    let brainCount = getAndSetLocal('brainCount', 7);//7;

    function updateCounts() {
      setTimeout(() => {
        document.getElementById('gravityCount').innerText = gravityCount;
        document.getElementById('crimeCount').innerText = crimeCount;
        document.getElementById('shockCount').innerText = shockCount;
        document.getElementById('brainCount').innerText = brainCount;
        document.getElementById('yourScore').innerText = yourScore;
      }, 500);
    }

    updateCounts();

    function updatePowerUps() {
      canReplace = false;
      canSwap = false;
      canCommitCrime = false;
    }

    const dialog = document.getElementById('myDialog');
    const openBtn = document.getElementById('openDialog');
    const closeBtn = document.getElementById('closeDialog');

    openBtn.addEventListener('click', () => {
      dialog.showModal(); // Use show() for non-modal
    });

    closeBtn.addEventListener('click', () => {
      dialog.close();
    });

    let currentAudio = null;
    let currentFile = "";

    // 🎚️ Volume control (0.0 — 1.0)
    function setAudioVolume(value) {
      if (currentAudio) {

    function playAudioToggle(filename) {
      // First time playing or new file requested
      if (!currentAudio || currentFile !== filename) {
        // Stop old audio if any
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        currentFile = filename;
        currentAudio = new Audio(filename);
        currentAudio.loop = true;
        currentAudio.play().catch(err => console.error("Audio play error:", err));
        return;
      }

      // Toggle play/pause for the same file
      if (currentAudio.paused) {
        currentAudio.play().catch(err => console.error("Audio resume error:", err));
      } else {
        currentAudio.pause();
        currentAudio.currentTime = 0; // restart if played again
      }
    }

    function playAudio(filename) {
      // Stop previous audio if playing
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      // Create new audio element
      currentAudio = new Audio(filename);
      currentAudio.loop = true; // Enable repeat
      currentAudio.play()
        .catch(err => console.error('Error playing audio:', err));
    }

    function showToast(message, type = 'info', duration = 3000) {
      const container = document.getElementById('toast-container');

      // Create toast element
      const toast = document.createElement('div');
      toast.classList.add('toast', type);
      toast.innerHTML = `
      <span>${message}</span>
      <span class="close-btn">&times;</span>
    `;

      // Append to container
      container.appendChild(toast);

      // Show with animation
      setTimeout(() => toast.classList.add('show'), 100);

      // Remove toast after duration
      const removeToast = () => {
        toast.classList.remove('show');
        setTimeout(() => container.removeChild(toast), 400);
      };

      // Auto remove after duration
      const timeoutId = setTimeout(removeToast, duration);

      // Close button event
      toast.querySelector('.close-btn').addEventListener('click', () => {
        clearTimeout(timeoutId);
        removeToast();
      });
    }

      for (let i = array.length - 1; i > 0; i--) {

      if (!letter || typeof letter !== 'string') return null; // handle invalid input

      if (vowels.includes(upper)) {
        return 'vowel';
      } else if (upper >= 'A' && upper <= 'Z') {
        return 'consonant';
      } else {
        return null; // not a letter

    function tileKey(col, row) {
      return `${col},${row}`;

    /**
     * Get a tile object at a specific grid coordinate.
     * If none exists yet, returns a default tile object.
     * @param {number} col
     * @param {number} row
     * @returns {{col:number, row:number, letter:string, color:string, status:string}}
     */
    function getTile(col, row) {
      const key = tileKey(col, row);
      if (!tileMap.has(key)) {
        // Lazy-generate a new tile with defaults
        const newTile = {
          col,
          row,
          letter: "_",
          color: 'cyan', // getTileColor(col, row),
          status: "empty"
        };
        tileMap.set(key, newTile);
      }
      return tileMap.get(key);
    }

          color: 'cyan', // getTileColor(col, row),

        };
        proposedTileMap.set(key, newTile);
      }
      return proposedTileMap.get(key);

    /**

     * @param {number} col
     * @param {number} row
     * @param {{col:number,row:number,letter:string,color:string,status:string}} tileObj
     */
    function setTile(col, row, tileObj) {
      if (!tileObj?.type) { tileObj.type = 'normal'; }

      const key = tileKey(col, row);
      // Merge given tileObj with col,row and store
      const updated = { col, row, ...tileObj };
      tileMap.set(key, updated);
    }

    function createWave() {
      const wavePoints = [];
      const resolution = 25; // col range -25..25
      const step = 1; // step size
      const amplitude = 10; // max wave height

      for (let col = -resolution; col <= resolution; col += step) {
        // sine wave formula
        const rowValue = 10 * Math.sin((col / resolution) * 2 * Math.PI);
        const row = Math.round(rowValue);

        // Fill in from 0 up to row (handles positive and negative waves)
        if (row >= 0) {
          for (let r = 0; r <= row; r++) {
            wavePoints.push({ col, row: r });
          }
        } else {
          for (let r = 0; r >= row; r--) {
            wavePoints.push({ col, row: r });
          }
        }
      }

      return wavePoints;
    }

      // Ensure tto exists and has col and row
      if (!tto || typeof tto.col !== 'number' || typeof tto.row !== 'number') return false;

      // Check if the point exists in the wavePoints
      const existsInWave = theWaveArea.some(
        point => point.col === tto.col && point.row === tto.row
      );

      if (!existsInWave) return true;

      // Original rules
      if ((tto.col + tto.row) % 8 === 0) {
        if (tto.row % 25 === 0) {
          return true;
        }
      }
      if (tto.col > 5 && tto.col < 15) {
        return true;
      }

      return false;
    }

        const dy = (t.clientY - dragStartY) / zoom;
        cameraX = cameraStartX - dx;
        cameraY = cameraStartY - dy;
      } else if (e.touches.length === 2) {
        const [t1, t2] = e.touches;
        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const mid = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };

        // Zoom around midpoint
        const zoomFactor = dist / lastTouchDist;
        const newZoom = Math.min(4, Math.max(0.25, touchCameraStart.zoom * zoomFactor));
        const zoomChange = newZoom / touchCameraStart.zoom;

        cameraX = touchCameraStart.x + (mid.x - touchStartMid.x) / newZoom / zoomChange;
        cameraY = touchCameraStart.y + (mid.y - touchStartMid.y) / newZoom / zoomChange;
        zoom = newZoom;
      }
      //captureCoords(t, false);
    });

    // TODO: CHECK AND VERIFY THAT TOUCH UPDATES REMOTE PLAYER POSITIONS...

    canvas.addEventListener("touchend", (e) => {
      if (event.touches.length === 0) {
        isDragging = false;
        lastTouchDist = null;
      }
    });

    // Optional mouse wheel zoom (desktop)
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.min(4, Math.max(0.25, zoom * zoomFactor));

      // Zoom around mouse position
      const mx = e.clientX;
      const my = e.clientY;
      cameraX += (mx / zoom - mx / newZoom);
      cameraY += (my / zoom - my / newZoom);
      zoom = newZoom;
    }, { passive: false });

    function randomLetter() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ_';
      return letters[Math.floor(Math.random() * letters.length)];
    }

    function setLetters() {
      for (let i = -25; i < 25; i++) {
        for (let j = -25; j < 25; j++) {
          setTile(i, j, { letter: '_' });
          if (Math.random() > .98) {
            setTile(i, j, { letter: randomLetter() });
          }
        }
      }
    }

    function draw() {

      ctx.fillStyle = 'black';

      ctx.fillRect(0, 0, canvas.width, canvas.height); // fill, not clearRect

      //ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(zoom, zoom);

      const startX = Math.floor(cameraX / TILE);
      const startY = Math.floor(cameraY / TILE);
      const endX = Math.ceil((cameraX + canvas.width / zoom) / TILE);
      const endY = Math.ceil((cameraY + canvas.height / zoom) / TILE);

      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "white";

      playerX = playerCol * TILE - cameraX;
      playerY = playerRow * TILE - cameraY;

      // actual tiles
      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          const px = x * TILE - cameraX;
          const py = y * TILE - cameraY;

          let theTile = getTile(x, y);

          let colBoundary = boardColsMagnitude;
          let rowBoundary = boardRowsMagnitude;

          // drawLetterTile(ctx, '_', px, py);

          if (theTile && theTile.letter !== "~" && theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) { // "_"

            if (theTile?.letter == "_") {
              drawLetterTile(ctx, theTile, px, py, true);
            } else {
              drawLetterTile(ctx, theTile, px, py);
            }

            ctx.lineWidth = 3;
            ctx.strokeStyle = "white"
            if (theTile.isSelected == true) { ctx.strokeRect(px + 6, py + 6, 64 - 12, 64 - 12) }
          } else {
            // if (theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) {
            //drawLetterTile(ctx, '_', px, py);
            //}
          }

          // Draw tile border
          // ctx.strokeStyle = "red";
          // ctx.lineWidth = 2;
          // ctx.strokeRect(px, py, TILE, TILE);

          // if (theTile?.type != 'normal') {
          ctx.strokeStyle = 'transparent';

          if (theTile?.type == 'gravitywave') {
            ctx.strokeStyle = 'blue';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("💫", px + TILE / 8, py + TILE / 8);
          }


          if (theTile?.type == 'crimewave') {
            ctx.strokeStyle = 'blue';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("🕵️‍♂️", px + TILE / 8, py + TILE / 8);
          }
          if (theTile?.type == 'shockwave') {
            ctx.strokeStyle = 'green';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("⚡", px + TILE / 8, py + TILE / 8);
          }
          if (theTile?.type == 'brainwave') {
            ctx.strokeStyle = 'red';
            ctx.font = "26px 'Segoe UI Emoji', sans-serif"; // bigger size, specify emoji-supporting font
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillText("🧠", px + TILE / 8, py + TILE / 8);
          }
          // }

          // Draw col,row centered on tile
          if (canCommitCrime) {
            if (theTile.letter != "_") {
              ctx.strokeStyle = 'blue';
              ctx.lineWidth = 5;
              ctx.strokeRect(px, py, TILE, TILE);
            }
          }

          if (canReplace) {
            if (theTile.letter != "_") {
              ctx.strokeStyle = 'green';
              ctx.lineWidth = 5;
              ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
            }
          }

          // if (x == playerCol) {
          //   playerX = px;
          // }

          // if (y == playerRow) {
          //   playerY = py;
          // }

        }
      }


      // proposed tiles
      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          const px = x * TILE - cameraX;
          const py = y * TILE - cameraY;

          let theTile = getProposedTile(x, y);

          // console.log(theTile.letter)

          let colBoundary = boardColsMagnitude;
          let rowBoundary = boardRowsMagnitude;

          // drawLetterTile(ctx, '_', px, py);

          if (theTile && theTile.letter !== "_" && theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) { // "_"
            drawLetterTile(ctx, theTile, px, py, true); // override draw to use proposed tile drawing image
            ctx.lineWidth = 3;
            ctx.strokeStyle = "white"
            if (theTile.isSelected == true) { ctx.strokeRect(px + 6, py + 6, 64 - 12, 64 - 12) }
          } else {
            // if (theTile.col > -colBoundary && theTile.col < colBoundary && theTile.row > -rowBoundary && theTile.row < rowBoundary) {
            //drawLetterTile(ctx, '_', px, py);
            //}
          }

          //ctx.fillText(`${x},${y}`, px, py);

        }
      }



      users.forEach((u) => {

        //console.log(u);

        let cplayerX = u.playerCol * TILE - cameraX;
        let cplayerY = u.playerRow * TILE - cameraY;

        let nickname = u?.nickname || "Unknown";

        ctx.font = "18px Arial";

        // if ((u?.dateTime)) {
        //   ctx.fillText(u.dateTime, cplayerX - 22, cplayerY - 32);
        // }

        if (nickname == myName) {
          ctx.fillStyle = 'black';
        } else {
          ctx.fillStyle = 'yellow';
        }

        if (nickname != myName && (Date.now() - u.dateTime) > 15000) {

        } else {
          ctx.drawImage(playerImage, cplayerX - 22, cplayerY - 22);

          if ((Date.now() - u.dateTime) < 1000) {
            ctx.fillText(nickname, cplayerX + TILE / 2, cplayerY + TILE / 2);
          }

        }

        if (nickname == myName) {

          if (lastDirectionXY.x > 0) {
            ctx.font = "40px courier";
            ctx.fillStyle = 'white';
            // ctx.fillRect(cplayerX + 25, cplayerY + 1, 15, 15);
            ctx.fillText("→", cplayerX + TILE / 2, cplayerY + TILE / 2)
          }

          if (lastDirectionXY.y > 0) {
            ctx.font = "40px courier";
            ctx.fillStyle = 'white';
            // ctx.fillRect(cplayerX + 1, cplayerY + 25, 15, 15);
            ctx.fillText("↓", cplayerX + TILE / 2, cplayerY + TILE / 2)
          }

        }

        // ctx.drawImage(playerImage, cplayerX - 22, cplayerY - 22);
        // ctx.fillText(nickname, cplayerX - 22, cplayerY - 22);

      });

      //ctx.drawImage(playerImage, playerX - 22, playerY - 22);

      ctx.restore();
    }


    // --- Animation loop ---
    function loop() {
      updateCamera();
      draw();
      requestAnimationFrame(loop);
    }

  </script>
