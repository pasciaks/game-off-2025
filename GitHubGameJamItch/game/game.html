    * {
      text-align: center;

    /* Toast container */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Toast style */
    .toast {
      display: flex;
      align-items: center;
      min-width: 250px;
      max-width: 350px;
      padding: 15px 20px;
      border-radius: 8px;
      color: #fff;
      font-family: sans-serif;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
      position: relative;
    }

    /* Toast types */
    .toast.success {
      background-color: #4CAF50;
    }

    .toast.error {
      background-color: #F44336;
    }

    .toast.info {
      background-color: #2196F3;
    }

    .toast.warning {
      background-color: #FFC107;
      color: #333;
    }

    /* Show toast */
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Close button */
    .toast .close-btn {
      margin-left: auto;
      cursor: pointer;
      font-weight: bold;
      padding-left: 10px;
    }

    dialog {
      border: none;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    /* button {
      padding: 8px 16px;

      border: none;
      border-radius: 5px;

  </style>

    function setAudioVolume(value) {

    function playAudioToggle(filename) {
      // First time playing or new file requested
      if (!currentAudio || currentFile !== filename) {
        // Stop old audio if any
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        currentFile = filename;
        currentAudio = new Audio(filename);
        currentAudio.loop = true;
        currentAudio.play().catch(err => console.error("Audio play error:", err));
        return;
      }

      // Toggle play/pause for the same file
      if (currentAudio.paused) {
        currentAudio.play().catch(err => console.error("Audio resume error:", err));
      } else {
        currentAudio.pause();
        currentAudio.currentTime = 0; // restart if played again
      }
    }

    function playAudio(filename) {
      // Stop previous audio if playing
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      // Create new audio element
      currentAudio = new Audio(filename);
      currentAudio.loop = true; // Enable repeat
      currentAudio.play()
        .catch(err => console.error('Error playing audio:', err));
    }

    function showToast(message, type = 'info', duration = 3000) {
      const container = document.getElementById('toast-container');

      // Create toast element
      const toast = document.createElement('div');
      toast.classList.add('toast', type);
      toast.innerHTML = `
      <span>${message}</span>
      <span class="close-btn">&times;</span>
    `;

      // Append to container
      container.appendChild(toast);

      // Show with animation
      setTimeout(() => toast.classList.add('show'), 100);

      // Remove toast after duration
      const removeToast = () => {
        toast.classList.remove('show');
        setTimeout(() => container.removeChild(toast), 400);
      };

      // Auto remove after duration
      const timeoutId = setTimeout(removeToast, duration);

      // Close button event
      toast.querySelector('.close-btn').addEventListener('click', () => {
        clearTimeout(timeoutId);
        removeToast();
      });
    }

    function shuffleInPlace(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createWave() {
      const wavePoints = [];
      const resolution = 25; // col range -25..25
      const step = 1; // step size
      const amplitude = 10; // max wave height

      for (let col = -resolution; col <= resolution; col += step) {
        // sine wave formula
        const rowValue = 10 * Math.sin((col / resolution) * 2 * Math.PI);
        const row = Math.round(rowValue);

        // Fill in from 0 up to row (handles positive and negative waves)
        if (row >= 0) {
          for (let r = 0; r <= row; r++) {
            wavePoints.push({ col, row: r });
          }
        } else {
          for (let r = 0; r >= row; r--) {
            wavePoints.push({ col, row: r });
          }
        }
      }

      return wavePoints;
    }

      if (!tto || typeof tto.col !== 'number' || typeof tto.row !== 'number') return false;

      // Check if the point exists in the wavePoints
      const existsInWave = theWaveArea.some(
        point => point.col === tto.col && point.row === tto.row
      );

      if (!existsInWave) return true;

      // Original rules
      if ((tto.col + tto.row) % 8 === 0) {
        if (tto.row % 25 === 0) {
          return true;
        }
      }
      if (tto.col > 5 && tto.col < 15) {
        return true;
      }

      return false;
    }

        cameraStartX = cameraX;
        cameraStartY = cameraY;
      } else if (e.touches.length === 2) {
        // Pinch zoom start
        isDragging = false;
        const [t1, t2] = e.touches;
        lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        touchStartMid = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2

        const newZoom = Math.min(4, Math.max(0.25, touchCameraStart.zoom * zoomFactor));

    }


    // --- Animation loop ---
    function loop() {
      updateCamera();
      draw();
      requestAnimationFrame(loop);
    }

  </script>
