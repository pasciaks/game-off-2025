            padding: 20px;
        }

            font-size: 24px;
            margin-bottom: 10px;
        }

        #soundList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        button.sound-btn {
            padding: 12px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
        }

        button.sound-btn:hover {
            background: #555;
        }
    </style>

        // Preload all audio objects
        const sounds = {};
        soundFiles.forEach(name => {
            sounds[name] = new Audio(name);
        });

        function playSound(f) {
            sounds[f].currentTime = 0;
            sounds[f].play();
        }


        function clientAction(key) {

            switch (key) {
                case "a":
                    playSound('pop_1.wav');
                    break;
                case "b":
                    playSound('gem_collect.wav');
                    break;
                case "c":
                    playSound('synth_cancel.wav');
                    break;
            }

        }

        // Build UI buttons
        const list = document.getElementById("soundList");
        soundFiles.forEach(name => {
            const btn = document.createElement("button");
            btn.className = "sound-btn";
            btn.textContent = name.replace(".wav", "");
            btn.onclick = () => {
                sounds[name].currentTime = 0;
                sounds[name].play();
            };
            list.appendChild(btn);
        });
