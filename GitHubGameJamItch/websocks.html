<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Scrabble Scramble - GitHub Game Jam 2025</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    #connectscreen {
      display: block;
    }

    #gamescreen {
      display: none;
    }

    #debugscreen {
      border: 2px solid gray;
      background-color: darkgray;
      color: black;
    }
  </style>
</head>

<body>
  <h1>Scrabble Scramble - GitHub Game Jam 2025</h1>

  <div id="connectscreen">
    <p>Connecting...</p>
  </div>

  <div id="gamescreen">
    <p>Playing...</p>
  </div>

  <div id="debugscreen">

    <button onclick="joinRoom('room1','sheldon')">Join Room 1 as sheldon</button>
    <button onclick="joinRoom('room1','john')">Join Room 1 as john</button>
    <button onclick="joinRoom('room2','sue')">Join Room 2 as sue</button>
    <button onclick="joinRoom('room2','mary')">Join Room 2 as mary</button>
    <input id="msg" placeholder="Type message" />
    <button onclick="sendMessage()">Send</button>
    <pre id="log"></pre>

  </div>

  <script>

    let mode = 'production'; // production

    mode = prompt("Which mode?", mode);

    let socket;

    switch (mode) {
      case "production":
        try {
          socket = io("https://pasciak.com:4433", {
            transports: ["websocket"], // optional: force WebSocket only
          });
          console.log("production - https://pasciak.com:4433");
        } catch (e) {
          socket = io("http://127.0.0.1:4433/", {
            transports: ["websocket"], // optional: force WebSocket only
          });
          console.log("production - errored, using http://127.0.0.1:4433/");
        }

        break;
      default:
        socket = io("http://127.0.0.1:4433/", {
          transports: ["websocket"], // optional: force WebSocket only
        });
        console.log("default - errored, using http://127.0.0.1:4433/");
        break;

    }

    const log = (text) => {
      document.getElementById("log").textContent += text + "\n";
    };

    socket.on("connect", () => {
      log("✅ Connected to server");
      document.getElementById("gamescreen").style.display = 'block';
      document.getElementById("connectscreen").style.display = 'none';
    });

    socket.on("reply", (msg) => {
      log("Server: " + msg);
    });

    socket.on("broadcast", (msg) => {
      log("Broadcasted: " + msg);
    });

    socket.on("disconnect", () => {
      log("❌ Disconnected");
    });

    socket.on("roomsList", (data) => {
      log(JSON.stringify(data));
    })

    socket.on("roomUsers", (data) => {
      log(JSON.stringify(data));
    })

    socket.on('message', (msg) => {
      console.log(msg)
      log(msg);
    });

    function sendMessage() {
      const msg = document.getElementById("msg").value;
      socket.emit("message", msg);
      socket.emit("getRooms", { test: 'getRooms Called' });
      log("You: " + msg);
    }

    function joinRoom(roomName, nickname) {
      socket.emit("joinRoom", { roomName, nickname });
    }

  </script>


</body>

</html>
