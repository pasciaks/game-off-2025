    html,
    body {
      margin: 0;
      height: 100%;
      background: #05060a;
      overflow: auto;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hidden {
      display: none;
      opacity: 0;
    }

    /* Optional: define default state when visible */
    .fade-in {
      display: block;
      animation: fadeIn 1s ease forwards;
    }

    .fade-out {
      display: block;
      animation: fadeOut 1s ease forwards;
    }

    /* The actual animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    /* The actual animation */
    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }


    #game {
      text-align: center;
      position: absolute;
      left: 20px;
      right: 20px;
      top: 20px;
      bottom: 20px;
      border: 2px solid red;
      color: white;
      display: none;
      background-color: rgba(25, 98, 115, .85);
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #0ee1ec;
      /* Tan background */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1,
    h2,
    p {
      text-align: center;
      margin: 10px 0;
      color: #cfcfcf;
    }

    button {
      padding: 1px 2px;
      border: none;
      border-radius: 8px;
      background-color: #aed1dd;
      color: rgb(95, 76, 204);
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #31a9a7;
      transform: scale(1.05);
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
      /* center the container itself */
      justify-items: center;
      /* center each item horizontally */
      align-items: center;
      /* center items vertically in their grid cells */
      text-align: center;
    }


    /* .game-container {
      text-align: center;
      align-items: center;
      justify-content: space-between;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 1000px;
      margin-bottom: 40px;
    } */

    .game-container a {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: #f0e6d2;
      /* light card color */
      color: #4879b4;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-container a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.25);
      background: #74d8ff;
    }

    img {
      width: 50%;
    }

    #game {
      overflow-y: auto;
      /* allow scrolling if content is taller */
      overflow-x: hidden;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Make grid adapt better on small screens */
    .game-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      justify-items: center;
      align-items: center;
    }

    /* Smaller buttons on narrow screens */
    @media (max-width: 600px) {

      button,
      .game-container a {
        font-size: 0.9rem;
        padding: 8px 10px;
      }

      .game-container {
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 8px;
      }

      #game {
        top: 10px;
        bottom: 10px;
      }
    }

    .menuText {
      font: 12px courier;
      color: white;
    }
  </style>

  <script>

    function submitCustomGame() {
      let c = document.getElementById('category').value;
      let w = document.getElementById('words').value;

      c = c.trim();
      w = w.trim();

      if (!c || !w) {
        return;
      }


      let url = "index.html?category=" + c + "&words=" + w;

      let currentUrl = window.location.href;

      console.log(currentUrl)

      let adjustedUrl = currentUrl.replace('maker.html', url);

      console.log(adjustedUrl)

      localStorage.setItem("share-link", adjustedUrl);

      window.location = adjustedUrl; // this should work for hidden url at itch

      // window.location = "./index.html?category=" + c + "&words=" + w;

    }

    function getParameterByName(name, url = window.location.href) {
      name = name.replace(/[\\[\\]]/g, '\\$&');
      const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
      const results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    let cat = getParameterByName('category');
    let words = getParameterByName('words');

    if (cat && words) {
      // Get the select element
      const select = document.getElementById("waveWordsSelect");

      // Create a new option
      const option = document.createElement("option");
      option.value = words;        // set the value
      option.textContent = cat;    // set the display text
      option.selected = true;      // optional: make it selected

      // Add the option to the select
      select.appendChild(option);
    }

    function showBox() {
      document.getElementById("game").style.display = "block";
      const el = document.getElementById('game');
      el.classList.remove('hidden');
      el.classList.remove('fade-out');
      el.classList.add('fade-in');
    }

    function hideBox() {
      document.getElementById("game").style.display = "block";
      const el = document.getElementById('game');
      el.classList.remove('hidden');
      el.classList.remove('fade-in');
      el.classList.add('fade-out');
    }

    const canvas = document.getElementById('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    let width, height, center, maxRadius;

    // Tuned parameters for cleaner, slower pulses
    const SPEED = 150;           // expansion speed (px/sec)
    const WAVELENGTH = 5;     // distance between waves (larger = fewer)
    const GLOW = 0;            // shadow blur for glow
    const SPAWN_INTERVAL = 220; // time between new waves (ms)
    const ROTATION_SPEED = 0.025; // radians/sec rotation of opening

    let waves = [];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      width = innerWidth;
      height = innerHeight;
      center = { x: width / 2, y: height / 2 };
      maxRadius = Math.hypot(width, height) * 0.6;
    }
    window.addEventListener('resize', resize);
    resize();

    function createWave() {
      const gapAngle = Math.random() * Math.PI * 2;
      const gapSize = 0;//Math.PI * (0.3 + Math.random() * 0.4);
      const hue = 190 + Math.random() * 40; // blue/cyan variation
      waves.push({
        startTime: performance.now(),
        gapAngle,
        gapSize,
        hue,
        offX: Math.random(),
        offY: Math.random()
      });
    }

    createWave();

    setTimeout(() => {
      showBox();
    }, 750);

    function invokeGame(url) {
      let v = document.getElementById('waveWordsSelect').value;
      localStorage.setItem('wavesWordsList', v);
      window.location = url;
    }

    // Author name generator
    function generateAuthorName() {
      const titles = ["Mr.", "Mrs.", "Ms.", "Dr.", "Prof."];
      const adjectives = [
        "Eloquent", "Mysterious", "Somber", "Brilliant", "Enigmatic", "Gentle",
        "Brooding", "Inspired", "Melancholic", "Witty", "Stoic", "Dreamy",
        "Vivid", "Arcane", "Noble", "Poetic", "Clever", "Ambitious", "Haunted",
        "Fabled", "Quiet", "Venerable", "Charming", "Daring", "Curious"
      ];
      const firstNames = [
        "Tobias", "Ada", "Lillian", "Oscar", "Julian", "Clara", "Eleanor", "Hugo",
        "Daphne", "Nathaniel", "Rowan", "Sylvia", "Edgar", "Vera", "August",
        "Florence", "Lucian", "Ivy", "Gideon", "Mabel", "Arthur", "Beatrice",
        "Felix", "Cecilia", "Miles"
      ];
      const lastNames = [
        "Quill", "Penwright", "Inkwell", "Thorne", "Austen", "Brontë", "Heming",
        "Wordsworth", "Hawthorne", "Byron", "Poe", "Shelley", "Twain", "Chaucer",
        "Dickens", "Wilde", "Frost", "Lowell", "Whitman", "Melville", "Keats",
        "Tennyson", "Carroll", "Eliot", "Huxley", "Orwell"
      ];
      const rand = arr => arr[Math.floor(Math.random() * arr.length)];
      return `${rand(titles)} ${rand(adjectives)} ${rand(firstNames)} ${rand(lastNames)}`;
    }

    let myName = localStorage.getItem("myName") || generateAuthorName();
    localStorage.setItem("myName", myName);
    document.getElementById("playerName").innerText = myName;

    function updateRandomName() {
      myName = generateAuthorName();
      localStorage.clear();
      localStorage.setItem("myName", myName);
      document.getElementById("playerName").innerText = myName;
    }



    let old;

    let isPaused = false;

    setInterval(createWave, SPAWN_INTERVAL);

    function animate(now) {

      if (isPaused) {
        now = old;
      }

      old = now;

      ctx.fillStyle = 'rgba(5,6,10,0.3)'; // faint fade trail
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = 'rgba(130,210,255,0.8)';
      ctx.shadowBlur = GLOW;

      for (const wave of waves) {
        const elapsed = (now - wave.startTime) / 1000;
        const radius = elapsed * SPEED;

        if (radius > maxRadius) continue;
        if (radius < 0) continue;

        const alpha = 1 - radius / maxRadius;
        ctx.lineWidth = 2 + 1.5 * alpha;
        ctx.strokeStyle = `hsla(${wave.hue}, 80%, 70%, ${alpha * 0.9})`;

        // slowly rotate the opening over time
        const rotatedGapAngle = wave.gapAngle + elapsed * ROTATION_SPEED;

        const start = rotatedGapAngle + wave.gapSize / 2;
        const end = rotatedGapAngle - wave.gapSize / 2 + Math.PI * 2;

        ctx.beginPath();
        ctx.arc(center.x + (.5 - wave.offX) * 350, center.y + (.5 - wave.offY) * 350, radius, start, end);
        ctx.stroke();
      }

      // cleanup old waves
      waves = waves.filter(w => (now - w.startTime) / 1000 * SPEED < maxRadius);

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);



  </script>
